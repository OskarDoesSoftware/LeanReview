spring.application.name=leanreview
# This milestone proves storage only. HTTP and the existing launcher arrive separately.
spring.main.web-application-type=none
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.sql.init.mode=never
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.hbm2ddl.halt_on_error=true
# Require an explicit isolated data directory until the production launcher is ported.
leanreview.data-directory=${LEANREVIEW_JAVA_DATA_DIR:}
