spring.application.name=leanreview
# Storage-only by default; opt into HTTP with --spring.profiles.active=web.
spring.main.web-application-type=none
server.address=127.0.0.1
server.port=4318
server.error.include-message=never
server.error.include-stacktrace=never
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.sql.init.mode=never
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.hbm2ddl.halt_on_error=true
# Require an explicit isolated data directory until the production launcher is ported.
leanreview.data-directory=${LEANREVIEW_JAVA_DATA_DIR:}
