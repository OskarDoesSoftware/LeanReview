<!doctype html>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,sans-serif}button,select,textarea,input{font:inherit;color:inherit}button,select{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:7px 11px;cursor:pointer}button:hover{background:var(--soft)}button:disabled{opacity:.5;cursor:default}button[aria-pressed=true],.primary{background:var(--accent);color:var(--bg);border-color:var(--accent)}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}textarea,input{background:var(--panel);border:1px solid var(--border);border-radius:5px;padding:8px;width:100%}header{background:var(--panel);border-bottom:1px solid var(--border);padding:16px 24px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.brand{font-size:19px;font-weight:650;letter-spacing:-.5px}.muted{color:var(--muted)}.small{font-size:12px}.badge{display:inline-block;border-radius:4px;background:var(--soft);padding:2px 6px;font-size:12px}.notice{padding:10px 24px;background:var(--warn);border-bottom:1px solid var(--border)}main{padding:20px 24px 100px;max-width:1700px;margin:auto}h1{font-size:23px;margin:0}h2{font-size:17px;margin:0 0 8px}h3{font-size:14px;margin:0 0 6px}p{margin:8px 0}.toolbar{margin:14px 0}.panel{background:var(--panel);border:1px solid var(--border);border-radius:8px;min-width:0}.pad{padding:16px}.workspace{display:grid;gap:16px}.sidebar-layout{grid-template-columns:245px minmax(0,1fr) 280px}.guided-layout{grid-template-columns:minmax(0,1fr) 310px}.map-layout{grid-template-columns:360px minmax(0,1fr)}.file{display:block;width:100%;text-align:left;border:0;border-radius:3px;margin:3px 0;padding:8px;font-size:12px;overflow-wrap:anywhere}.file.active{background:var(--soft);box-shadow:inset 3px 0 var(--accent)}.cohort{padding:14px;border-bottom:1px solid var(--border)}.cohort:last-child{border:0}.layer-label{margin:8px 0 2px;color:var(--muted);font-size:12px}.file-top{padding:14px;border-bottom:1px solid var(--border)}.diff{overflow:auto}.diff table{width:100%;border-collapse:collapse;table-layout:fixed;font:12px/1.65 ui-monospace,Consolas,monospace}.diff td{vertical-align:top;border-right:1px solid var(--border);padding:0}.code-line{display:flex;min-height:27px;white-space:pre-wrap;overflow-wrap:anywhere}.line-no{width:48px;flex-shrink:0;padding:3px;text-align:right;border:0;border-radius:0;background:transparent;color:var(--muted);font:inherit}.code{padding:3px 8px}.plus{background:var(--add)}.minus{background:var(--del)}.diff .line-no:hover{background:var(--soft)}.tabs{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:14px}.tabs button{padding:6px 8px}.inspector-list{border-bottom:1px solid var(--border);padding:10px 0}.meter{font-size:32px;letter-spacing:-1px}.progress{height:6px;background:var(--border);border-radius:6px;overflow:hidden;min-width:140px}.progress i{display:block;background:var(--accent);height:100%}.step-strip{display:flex;gap:10px;margin:16px 0;flex-wrap:wrap}.step{flex:1;min-width:145px;text-align:left;padding:12px}.graph-nodes{display:grid;grid-template-columns:1fr;gap:9px}.node{text-align:left;padding:12px}.edge{font-size:12px;color:var(--muted);padding-left:14px}.map-layout .graph-nodes{grid-template-columns:1fr 1fr}.map-layout .edge{grid-column:1/-1}.switcher{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:50;background:var(--ink);color:var(--bg);padding:7px 12px;border-radius:30px;box-shadow:0 5px 22px #0003;display:flex;gap:14px;align-items:center;white-space:nowrap}.switcher button{background:transparent;color:inherit;border:0;padding:5px 12px}.switcher strong{font-size:13px}.state{margin-top:20px}.state pre{font-size:12px;overflow:auto;max-height:260px}.coverage-table{width:100%;border-collapse:collapse;font-size:12px}.coverage-table th,.coverage-table td{padding:7px 4px;text-align:left;border-bottom:1px solid var(--border)}.scope-nav{margin-top:14px}.proposal{padding:14px;background:var(--soft);border:1px solid var(--border);border-radius:8px;margin-bottom:16px}.empty{padding:35px 20px}.guided-intro{background:var(--soft);padding:18px;border-radius:8px;margin-bottom:15px}.comment-target{background:var(--soft);padding:8px;margin:8px 0}.footer-actions{padding:12px 16px;border-top:1px solid var(--border)}label{display:block}.offline{background:var(--warn)}
@media(max-width:1150px){.sidebar-layout{grid-template-columns:220px minmax(0,1fr)}.sidebar-layout>.inspector{grid-column:1/-1}.sidebar-layout>.inspector .coverage-table{max-width:650px}.map-layout{grid-template-columns:280px minmax(0,1fr)}}
@media(max-width:760px){header,main{padding-left:12px;padding-right:12px}.workspace{display:block}.workspace>.panel{margin-bottom:12px}.sidebar-layout>aside nav{display:flex;flex-wrap:wrap}.cohort{flex:1;min-width:200px}.diff table{font-size:11px}.switcher{gap:2px;max-width:95%}.switcher strong{font-size:11px}.line-no{width:32px}.notice{padding:10px 12px}.step{min-width:130px}h1{font-size:20px}}
</style></head><body><div id="app"></div><script>
const files=[
{id:'types',path:'src/auth/types.ts',cohort:'Authentication',layer:1,status:'Added',before:[],after:['export interface LoginRequest {','  email: string;','  password: string;','}'],fn:'LoginRequest',complexity:null,coverage:null},
{id:'validator',path:'src/auth/validatePassword.ts',cohort:'Authentication',layer:2,status:'Modified',before:['export function validatePassword(value: string) {','  return value.length >= 8;','}'],after:['export function validatePassword(value: string) {','  if (value.length < 12) return false;','  if (!/[A-Z]/.test(value)) return false;','  return /[0-9]/.test(value);','}'],fn:'validatePassword',complexity:3,coverage:.5},
{id:'endpoint',path:'src/api/login.ts',cohort:'Authentication',layer:3,status:'Modified',before:['router.post("/login", async (req, res) => {','  const user = await authenticate(req.body);','  res.json(user);','});'],after:['router.post("/login", async (req, res) => {','  if (!validatePassword(req.body.password)) {','    return res.status(400).json({ error: "Invalid input" });','  }','  const user = await authenticate(req.body);','  res.json(user);','});'],fn:'login',complexity:2,coverage:null},
{id:'tests',path:'src/auth/validatePassword.test.ts',cohort:'Authentication',layer:4,status:'Added',before:[],after:['it("rejects short passwords", () => {','  expect(validatePassword("A1")).toBe(false);','});'],fn:'test case',complexity:null,coverage:null},
{id:'logger',path:'src/logging/logger.ts',cohort:'Logging cleanup',layer:1,status:'Renamed',oldPath:'src/util/log.ts',before:['export const log = console.log;'],after:['export const log = console.info;'],fn:'log',complexity:null,coverage:null},
{id:'removed',path:'src/auth/legacyPassword.ts',cohort:'Authentication',layer:2,status:'Deleted',before:['export const minimumPasswordLength = 8;'],after:[],fn:'legacy constant',complexity:null,coverage:null},
{id:'binary',path:'public/login-banner.png',cohort:'Authentication',layer:3,status:'Binary',before:[],after:[],fn:'binary',complexity:null,coverage:null}
];
const variantNames={A:'Cohort sidebar',B:'Guided layers',C:'Change map'};
const state={variant:['A','B','C'].includes(new URLSearchParams(location.search).get('variant'))?new URLSearchParams(location.search).get('variant'):'A',file:'validator',tab:'Explanation',diff:'split',source:'GitHub',scenario:'Ready',snapshot:1,reviewed:[],comments:[],target:null,proposal:false,coverage:false,graphScope:'PR',graphSide:'After',graphLanguage:'TS/JS',message:'Sample review ready. All actions are simulated.',oldSnapshots:[]};
const $=s=>document.querySelector(s), escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const selected=()=>files.find(f=>f.id===state.file);
const button=(text,action,attrs='')=>`<button type="button" data-action="${action}" ${attrs}>${text}</button>`;
function selectOptions(values,current){return values.map(v=>`<option ${v===current?'selected':''}>${v}</option>`).join('')}
function fileButton(f){return button(`${state.reviewed.includes(f.id)?'✓':'○'} ${escape(f.path)} <span class="badge">${f.status}</span>`,'file',`data-id="${f.id}" class="file ${state.file===f.id?'active':''}" aria-pressed="${state.file===f.id}"`)}
function sidebar(){return `<aside class="panel"><div class="pad"><h2>Cohorts & layers</h2><span class="muted small">AI proposal accepted · editable</span></div><nav aria-label="Review layers">${[...new Set(files.map(f=>f.cohort))].map(c=>`<section class="cohort"><h3>${escape(c)}</h3>${[...new Set(files.filter(f=>f.cohort===c).map(f=>f.layer))].sort().map(l=>`<div class="layer-label">Layer ${l} · ${['Contract','Rules','Integration','Tests'][l-1]||'Changes'}</div>${files.filter(f=>f.cohort===c&&f.layer===l).map(fileButton).join('')}`).join('')}</section>`).join('')}</nav></aside>`}
function diff(){const f=selected();if(f.status==='Binary')return `<div class="empty"><h2>Binary change</h2><p>No text diff available. Acknowledge this file separately.</p>${button('Acknowledge binary file','review','class="primary"')}</div>`;const line=(text,num,side,style)=>`<div class="code-line ${style}">${num?button(num,'line',`class="line-no" data-side="${side}" data-line="${num}" aria-label="Comment on ${side} line ${num}"`):'<span class="line-no"></span>'}<span class="code">${escape(text||'')}</span></div>`;let rows='';if(state.diff==='split'){for(let i=0;i<Math.max(f.before.length,f.after.length);i++)rows+=`<tr><td>${line(f.before[i],i<f.before.length?i+1:null,'Before',f.before[i]!==f.after[i]&&f.before[i]!==undefined?'minus':'')}</td><td>${line(f.after[i],i<f.after.length?i+1:null,'After',f.before[i]!==f.after[i]&&f.after[i]!==undefined?'plus':'')}</td></tr>`;return `<div class="diff"><table aria-label="Illustrative side-by-side diff"><thead><tr><th>Before</th><th>After</th></tr></thead><tbody>${rows}</tbody></table></div>`}return `<div class="diff"><table aria-label="Illustrative unified diff"><tbody>${f.before.map((v,i)=>`<tr><td>${line('- '+v,i+1,'Before','minus')}</td></tr>`).join('')}${f.after.map((v,i)=>`<tr><td>${line('+ '+v,i+1,'After','plus')}</td></tr>`).join('')}</tbody></table></div>`}
function editor(){const f=selected();return `<section class="panel"><div class="file-top"><div class="row between"><strong>${escape(f.path)}</strong><span class="badge">${f.status}</span></div>${f.oldPath?`<p class="muted small">Renamed from ${escape(f.oldPath)}</p>`:''}<div class="row toolbar">${button('Side by side','diff',`data-mode="split" aria-pressed="${state.diff==='split'}"`)}${button('Unified','diff',`data-mode="unified" aria-pressed="${state.diff==='unified'}"`)}${button(state.reviewed.includes(f.id)?'✓ Reviewed':'Mark file reviewed','review','class="primary"')}</div><span class="muted small">Click a line number to draft a comment. Editor interactions are illustrative.</span></div>${diff()}<div class="footer-actions row between"><label class="small">Move file to cohort <select id="move">${selectOptions(['Authentication','Logging cleanup'],f.cohort)}</select></label>${button('Mark current layer reviewed','layer')}${button('Next file →','next')}</div></section>`}
function graph(full=false){const scope=full?'Repository':state.graphScope;const java=state.graphLanguage==='Java';let nodes=java?[['pkg-auth','com.example.auth'],['pkg-api','com.example.api'],['pkg-core','com.example.core']]:[['endpoint','login.ts'],['validator','validatePassword.ts'],['types','types.ts']];if(scope==='Repository')nodes.push(java?['pkg-data','com.example.persistence']:['logger','logger.ts'],java?['pkg-test','com.example.tests']:['tests','validatePassword.test.ts']);return `<div class="row toolbar"><label>Scope <select id="graph-scope">${selectOptions(['PR','Repository'],scope)}</select></label><label>Revision <select id="graph-side">${selectOptions(['Before','After'],state.graphSide)}</select></label><label>Language <select id="graph-language">${selectOptions(['TS/JS','Java'],state.graphLanguage)}</select></label></div><div class="graph-nodes">${nodes.map(([id,n])=>button(escape(n),'node',`data-id="${id}" class="node"`)).join('')}<div class="edge">${java?'api → auth → core':'login.ts → validatePassword.ts → types.ts'} · observed</div>${state.graphSide==='After'?'<div class="edge">Added dependency in this revision</div>':'<div class="edge">Before snapshot dependencies</div>'}<div class="edge">Dashed/suggested: ${java?'auth → persistence':'login.ts → logger.ts'} · AI suggestion</div></div><p class="small muted">${scope==='Repository'?'Repository scan: 42 / 48 files. 6 skipped; 2 unresolved imports.':'Changed files and direct dependencies. Incoming callers partially scanned.'} ${java?'Select a package to inspect its classes.':'Select a module to open its diff.'}</p>${button('Expand neighbors','expand')}${state.message.startsWith('Package')?`<p>${escape(state.message)}</p>`:''}`}
function metrics(){const f=selected(),q=state.coverage ? .8 : f.coverage;const score=f.complexity&&q!==null?(f.complexity*f.complexity*Math.pow(1-q,3)+f.complexity).toFixed(2):null;return `<h3>CRAP · ${escape(f.fn)}</h3><div class="meter">${score||'Unavailable'}</div><p>${f.complexity?'Complexity '+f.complexity:'No measurable function'} · Coverage ${q===null?'unavailable':Math.round(q*100)+'%'}</p><p class="small muted">${state.graphLanguage==='Java'?'JaCoCo instruction':'Statement'} coverage · snapshot ${state.snapshot}<br>${state.coverage?'Simulated aligned report':'Sample imported report'} · measured examples</p><table class="coverage-table"><thead><tr><th>Summary</th><th>Value</th></tr></thead><tbody><tr><td>Highest score</td><td>${state.coverage?'3.07':'4.13'}</td></tr><tr><td>Missing measurements</td><td>${state.coverage?'0':'1'} functions</td></tr><tr><td>Before score</td><td>N/A · no aligned report</td></tr></tbody></table><div class="row toolbar">${button('Import report','import')}${button('Run tests & coverage','tests')}</div><p class="small muted">CRAP is unbounded. Warning threshold is advisory. No tests run in this prototype.</p>`}
function comments(){return `<h3>Draft comments</h3><p class="small muted">${state.source==='Local Git'?'Local notes only':'Explicit publication required'} · ${state.comments.length} drafts</p>${state.target?`<div class="comment-target">${escape(state.target.path)} · ${state.target.side} line ${state.target.line}</div>`:'<p>Select a diff line number first.</p>'}<label>Comment<textarea id="comment-text" rows="3" placeholder="Write a review comment"></textarea></label><div class="toolbar">${button('Save draft','save-comment',state.target?'':'disabled')}</div>${state.comments.map(c=>`<div class="inspector-list"><span class="badge">${c.needsAttach?'Needs reattachment':'Draft'}</span><p>${escape(c.text)}</p><span class="small muted">${escape(c.path)} · ${c.side} ${c.line} · snapshot ${c.snapshot}</span></div>`).join('')}${button('Preview publication','publish',state.source==='Local Git'||state.scenario==='Incomplete listing'?'disabled':'')}<p class="small muted">Preview only. No remote requests or publication.</p>`}
function inspector(){let content;if(state.tab==='Explanation')content=`<h3>Why this layer comes next</h3><p>${selected().layer===1?'Start with the shared contract before following its callers.':selected().layer===2?'Understand the password rules before reviewing how the endpoint applies them.':selected().layer===3?'Follow the integration after understanding the contract and validation.':'Review tests after seeing the behavior they exercise.'}</p><span class="badge">Suggested reading order</span><h3 style="margin-top:22px">AI finding</h3><p>Applying password-strength rules at login may reject existing valid passwords.</p><p class="small muted">AI suggestion · verify intent. Not a measured static finding.</p>${button('Draft comment from finding','finding')}`;else if(state.tab==='CRAP')content=metrics();else if(state.tab==='Graph')content=graph();else content=comments();return `<aside class="panel inspector pad"><div class="tabs" aria-label="File details">${['Explanation','CRAP','Graph','Comments'].map(t=>button(t,'tab',`data-tab="${t}" aria-pressed="${state.tab===t}"`)).join('')}</div>${content}</aside>`}
function VariantA(){return `<div class="workspace sidebar-layout">${sidebar()}${editor()}${inspector()}</div>`}
function VariantB(){const f=selected();return `<div class="guided-intro"><span class="small muted">Authentication · guided reading order</span><h2>Layer ${f.layer}: ${['Contract','Validation rules','Integration','Tests'][f.layer-1]}</h2><p>Review one layer at a time. Progress is based on its files, not on accepting AI analysis.</p></div><div class="step-strip">${[1,2,3,4].map(l=>button(`<span class="small muted">Layer ${l}</span><br>${['Contract','Rules','Integration','Tests'][l-1]}`,'step',`data-layer="${l}" class="step" aria-pressed="${f.layer===l}"`)).join('')}</div><div class="row toolbar">${files.filter(x=>x.cohort===f.cohort&&x.layer===f.layer).map(fileButton).join('')}</div><div class="workspace guided-layout">${editor()}${inspector()}</div><details class="panel pad toolbar"><summary>All cohorts and files</summary>${sidebar()}</details>`}
function VariantC(){return `<div class="workspace map-layout"><section class="panel pad"><h2>Change map</h2><p class="small muted">Start with relationships, then open a module.</p>${graph()}<details class="toolbar"><summary>All changed files</summary>${files.map(fileButton).join('')}</details></section><div>${editor()}<div style="margin-top:16px">${inspector()}</div></div></div>`}
function render(){const count=state.reviewed.length,percent=Math.round(count/files.length*100);$('#app').innerHTML=`<header><div class="row between"><div class="row"><span class="brand">LeanReview</span><select id="source" aria-label="Repository source">${selectOptions(['Local Git','GitHub','Azure DevOps'],state.source)}</select><span>acme / identity-service</span><span class="badge">Throwaway prototype · sample data</span></div><div class="row"><label class="small">Scenario <select id="scenario">${selectOptions(['Ready','AI unavailable','Offline','Incomplete listing'],state.scenario)}</select></label></div></div><div class="scope-nav row">${button('PR review','scope',`data-scope="PR" aria-pressed="${state.graphScope==='PR'}"`)}${button('Repository graph','scope',`data-scope="Repository" aria-pressed="${state.graphScope==='Repository'}"`)}</div></header>${state.scenario!=='Ready'?`<div class="notice" role="status">${state.scenario==='AI unavailable'?'AI unavailable. Accepted grouping and progress preserved; plain diff review remains available.':state.scenario==='Offline'?'Offline · cached snapshot accessible. Uncached context and remote publication unavailable.':'Incomplete file listing · review completion and publishing blocked.'}</div>`:''}<main><div class="row between"><div><span class="muted small">${state.source==='Local Git'?'All uncommitted changes':'PR #84 · main ← feature/password-policy'}</span><h1>Strengthen password validation</h1><p class="muted small">Snapshot ${state.snapshot} · ${state.snapshot===1?'a91c3e2':'d82b4f1'} · captured review · ${state.oldSnapshots.length} previous snapshots</p></div><div><div class="row"><strong>${count} / ${files.length} files reviewed</strong><span>${percent}%</span></div><div class="progress" role="progressbar" aria-label="Review progress" aria-valuenow="${percent}" aria-valuemin="0" aria-valuemax="100"><i style="width:${percent}%"></i></div></div></div><div class="row toolbar">${button('Generate analysis proposal','generate')}${button('Refresh snapshot','refresh')}${button('Review complete','complete',count===files.length&&state.scenario!=='Incomplete listing'?'':'disabled')}<span class="small muted" role="status" aria-live="polite">${escape(state.message)}</span></div>${state.proposal?`<div class="proposal row between"><div><strong>New analysis proposal</strong><p>3 cohorts · 5 layers · 2 AI findings. Existing edits stay until accepted.</p></div><div class="row">${button('Accept proposal','accept','class="primary"')}${button('Discard','discard')}</div></div>`:''}${state.graphScope==='Repository'?`<section class="panel pad"><h2>Repository module graph</h2>${graph(true)}</section>`:({A:VariantA,B:VariantB,C:VariantC}[state.variant])()}<details class="state panel pad"><summary>Prototype state · inspect after interactions</summary><pre>${escape(JSON.stringify({...state,files:files.map(f=>({id:f.id,cohort:f.cohort,layer:f.layer}))},null,2))}</pre></details></main><div class="switcher" aria-label="Prototype layout switcher">${button('←','prev-variant','aria-label="Previous layout"')}<strong>${state.variant} · ${variantNames[state.variant]}</strong>${button('→','next-variant','aria-label="Next layout"')}</div>`}
function setVariant(delta){const keys=['A','B','C'];state.variant=keys[(keys.indexOf(state.variant)+delta+3)%3];const url=new URL(location.href);url.searchParams.set('variant',state.variant);history.replaceState(null,'',url);render()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const f=selected();switch(b.dataset.action){case'prev-variant':setVariant(-1);return;case'next-variant':setVariant(1);return;case'file':state.file=b.dataset.id;state.target=null;break;case'diff':state.diff=b.dataset.mode;break;case'review':state.reviewed=state.reviewed.includes(f.id)?state.reviewed.filter(x=>x!==f.id):[...state.reviewed,f.id];state.message='File progress updated.';break;case'layer':files.filter(x=>x.cohort===f.cohort&&x.layer===f.layer).forEach(x=>{if(!state.reviewed.includes(x.id))state.reviewed.push(x.id)});state.message='Layer files marked reviewed.';break;case'next':state.file=files[(files.indexOf(f)+1)%files.length].id;break;case'tab':state.tab=b.dataset.tab;break;case'line':state.target={file:f.id,path:f.path,line:Number(b.dataset.line),side:b.dataset.side};state.tab='Comments';break;case'save-comment':{const text=$('#comment-text').value.trim();if(!text)return;state.comments.push({...state.target,text,snapshot:state.snapshot,needsAttach:false});state.target=null;state.message='Draft saved locally.';break}case'finding':state.target={file:'endpoint',path:'src/api/login.ts',line:2,side:'After'};state.tab='Comments';state.file='endpoint';break;case'refresh':state.oldSnapshots.push({snapshot:state.snapshot,reviewed:[...state.reviewed],comments:state.comments.map(c=>({...c}))});state.snapshot++;state.reviewed=state.reviewed.filter(id=>id!=='validator');files.find(x=>x.id==='validator').after[1]='  if (value.length < 14) return false;';state.comments=state.comments.map(c=>c.file==='validator'?{...c,needsAttach:true}:({...c,snapshot:state.snapshot}));state.target=null;state.coverage=false;files.find(x=>x.id==='validator').coverage=null;state.message='New snapshot: validation changed; its progress reset and affected drafts need reattachment.';break;case'generate':if(state.scenario==='AI unavailable'||state.scenario==='Offline'){state.message='Generation failed. Accepted grouping and edits preserved. Retry when available.'}else{state.proposal=true;state.message='Proposal ready for explicit acceptance.'}break;case'accept':state.proposal=false;files.find(x=>x.id==='binary').cohort='Presentation';state.message='Proposal accepted. File review progress unchanged.';break;case'discard':state.proposal=false;state.message='Proposal discarded; previous grouping preserved.';break;case'step':state.file=files.find(x=>x.cohort==='Authentication'&&x.layer===Number(b.dataset.layer)).id;break;case'scope':state.graphScope=b.dataset.scope;break;case'node':if(b.dataset.id.startsWith('pkg-')){state.message='Package '+b.textContent+': LoginController, PasswordValidator, UserAccount · sample class drill-down.'}else if(files.some(x=>x.id===b.dataset.id)){state.file=b.dataset.id;state.graphScope='PR'}break;case'expand':state.message='Neighbors expanded: authenticate.ts · external bcrypt · 2 unresolved imports.';break;case'import':state.coverage=true;state.message='Simulated aligned coverage imported for current snapshot.';break;case'tests':state.message='Preview only: npm run test -- --coverage · selected checkout. No command executed.';break;case'publish':state.message=state.scenario==='Offline'?'Publication unavailable offline. Drafts preserved.':state.comments.some(c=>c.needsAttach)?'Preview blocked: reattach stale drafts first.':'Preview only: '+state.comments.length+' drafts. Explicit confirmation would follow; nothing published.';break;case'complete':state.message='Review marked complete locally. No PR approval or comment publication.';break}render()});
document.addEventListener('change',e=>{switch(e.target.id){case'source':state.source=e.target.value;break;case'scenario':state.scenario=e.target.value;state.message='Scenario changed; review work preserved.';break;case'move':selected().cohort=e.target.value;state.message='File moved; reviewed state preserved.';break;case'graph-scope':state.graphScope=e.target.value;break;case'graph-side':state.graphSide=e.target.value;break;case'graph-language':state.graphLanguage=e.target.value;break}render()});
document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,select,[contenteditable]'))return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();setVariant(e.key==='ArrowLeft'?-1:1)}});render();
</script></body></html>
